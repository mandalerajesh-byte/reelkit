[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelkit"
version = "0.1.0"
description = "Free, offline AI toolkit for video creators: auto word-by-word captions (Hindi included) and silence cutting for Reels, Shorts and TikToks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["faster-whisper>=1.0.0", "av>=11,<17"]
keywords = ["reels", "shorts", "captions", "subtitles", "whisper", "ffmpeg", "video", "hindi", "ai", "silence-remover"]

[project.scripts]
reelkit = "reelkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
